<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 220px;
      padding: 15px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f9f9f9;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .section-title {
      font-size: 13px;
      font-weight: bold;
      color: #555;
      border-bottom: 1px solid #ddd;
      padding-bottom: 5px;
    }
    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }
    input[type="range"] {
      width: 100%;
      cursor: pointer;
    }
    .presets {
      display: flex;
      gap: 5px;
      justify-content: space-between;
    }
    .presets button {
      flex: 1;
      padding: 5px 0;
      font-size: 12px;
      cursor: pointer;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .presets button:hover {
      background: #eef;
    }
    select {
      width: 100%;
      padding: 5px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 14px;
      cursor: pointer;
    }
    .help-container {
      margin-top: 10px;
      text-align: center;
    }
    .help-toggle {
      font-size: 12px;
      color: #0066cc;
      cursor: pointer;
      text-decoration: underline;
      background: none;
      border: none;
      padding: 0;
    }
    .help-content {
      display: none;
      text-align: left;
      font-size: 11px;
      color: #666;
      background: #eee;
      padding: 10px;
      border-radius: 4px;
      margin-top: 10px;
      line-height: 1.4;
    }
    .help-content b {
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Font Size Section -->
    <div class="section">
      <div class="section-title">Text Size</div>
      <div class="label-row">
        <label for="fontSize">Font Size:</label>
        <span id="sizeVal">24px</span>
      </div>
      <input type="range" id="fontSize" min="12" max="100" value="24">

      <div class="presets">
        <button id="presetSmall">Small</button>
        <button id="presetMedium">Medium</button>
        <button id="presetLarge">Large</button>
      </div>
    </div>

    <!-- Theme Section -->
    <div class="section">
      <div class="section-title">Editor Theme</div>
      <select id="themeMode">
        <option value="default">Default phpMyAdmin</option>
        <option value="dark">Professional Dark</option>
        <option value="contrast">High Contrast (Neon)</option>
        <option value="dracula">Dracula</option>
        <option value="solarized">Solarized</option>
        <option value="ocean">Ocean</option>
      </select>
    </div>

    <!-- Power User Settings -->
    <div class="section">
      <div class="section-title">Power User Suite</div>
      <div class="label-row">
        <label for="autoJump">Auto-Jump to SQL</label>
        <input type="checkbox" id="autoJump">
      </div>
      <div class="label-row">
        <label for="compactMode">Compact Mode</label>
        <input type="checkbox" id="compactMode">
      </div>
    </div>

    <!-- Help Guide Section -->
    <div class="help-container">
      <button id="toggleHelp" class="help-toggle">What are these options?</button>
      <div id="helpContent" class="help-content">
        <b>Auto-Jump:</b> Automatically returns you to the SQL query tab 2 seconds after a successful execution.<br><br>
        <b>Compact Mode:</b> Shrinks table spacing to let you see more data rows at once.
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
